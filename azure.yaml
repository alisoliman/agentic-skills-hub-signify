# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: agentic-skills-hub
metadata:
  template: agentic-skills-hub@0.1.0

infra:
  provider: bicep

services:
  web:
    project: .
    host: staticwebapp
    language: js
    dist: site
    hooks:
      predeploy:
        posix:
          shell: sh
          run: npm run build
        windows:
          shell: pwsh
          run: npm run build

